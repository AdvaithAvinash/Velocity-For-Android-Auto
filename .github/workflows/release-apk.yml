name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install required Android SDK packages
        # Don't assume where (or whether) a usable cmdline-tools install
        # already lives on the runner - look for one, and if it's not
        # there, fetch cmdline-tools straight from Google. That's more
        # code than trusting a preinstalled path, but it can't silently
        # fail just because the runner image changed underneath us.
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK_ROOT=$SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "No existing sdkmanager found under $SDK_ROOT - fetching cmdline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager at $SDKMANAGER"
          CMDLINE_TOOLS_BIN="$(dirname "$SDKMANAGER")"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          export PATH="$CMDLINE_TOOLS_BIN:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Download uber-apk-signer
        # The release asset filename includes a version number, so a fixed
        # ".../releases/latest/download/uber-apk-signer.jar" URL 404s - ask
        # the GitHub API for the actual current asset URL instead.
        run: |
          mkdir -p tools
          JAR_URL=$(curl -fsSL https://api.github.com/repos/patrickfav/uber-apk-signer/releases/latest \
            | grep -o 'https://[^"]*\.jar' | head -n1)
          echo "Resolved uber-apk-signer jar URL: $JAR_URL"
          curl -fL -o tools/uber-apk-signer.jar "$JAR_URL"

      - name: Sign release APK
        env:
          UBER_APK_SIGNER_JAR: tools/uber-apk-signer.jar
        run: |
          chmod +x scripts/sign-release.sh
          UNSIGNED_APK=$(find app/build/outputs/apk/release -iname "*-unsigned.apk" | head -n1)
          echo "Signing $UNSIGNED_APK"
          ./scripts/sign-release.sh "$UNSIGNED_APK"

      - name: Collect signed APK
        id: apk
        run: |
          SIGNED_APK=$(find app/build/outputs/apk/release -iname "*-aligned-debugSigned.apk" -o -iname "*-aligned-signed.apk" | head -n1)
          if [ -z "$SIGNED_APK" ]; then
            SIGNED_APK=$(find app/build/outputs/apk/release -iname "*.apk" ! -iname "*unsigned*" | head -n1)
          fi
          echo "Found signed APK: $SIGNED_APK"
          cp "$SIGNED_APK" velocity.apk
          echo "version=$(grep versionName app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        # Releases are published manually now - this step just makes the
        # signed APK downloadable from the run's "Artifacts" section.
        uses: actions/upload-artifact@v4
        with:
          name: velocity-apk
          path: velocity.apk

name: Build and release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Download uber-apk-signer
        run: |
          mkdir -p tools
          curl -fL -o tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/latest/download/uber-apk-signer.jar

      - name: Sign release APK
        env:
          UBER_APK_SIGNER_JAR: tools/uber-apk-signer.jar
        run: |
          chmod +x scripts/sign-release.sh
          UNSIGNED_APK=$(find app/build/outputs/apk/release -iname "*-unsigned.apk" | head -n1)
          echo "Signing $UNSIGNED_APK"
          ./scripts/sign-release.sh "$UNSIGNED_APK"

      - name: Collect signed APK
        id: apk
        run: |
          SIGNED_APK=$(find app/build/outputs/apk/release -iname "*-aligned-debugSigned.apk" -o -iname "*-aligned-signed.apk" | head -n1)
          if [ -z "$SIGNED_APK" ]; then
            SIGNED_APK=$(find app/build/outputs/apk/release -iname "*.apk" ! -iname "*unsigned*" | head -n1)
          fi
          echo "Found signed APK: $SIGNED_APK"
          cp "$SIGNED_APK" velocity.apk
          echo "version=$(grep versionName app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-apk
          path: velocity.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: Velocity v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build of Velocity, signed with a throwaway uber-apk-signer keystore
            (see `scripts/sign-release.sh`). Install via KingsInstaller as described in the README.
          files: velocity.apk
          generate_release_notes: false
